# One lockfile, one package, per-role dependency groups:
#   uv sync                      -> core + kin + data (the default working set)
#   uv sync --group train        -> + jax/openpi training stack
#   uv sync --group deploy       -> + DDS/unitree_deploy robot stack
#   uv sync --group teleop       -> + vuer WebXR teleop
#   uv sync --group perception   -> + deploy + GroundingDINO/SAM2 live detection
# Machine-specific overlays (PPU box borrowed venv, robot PC) are NOT uv-managed;
# they are documented profiles in envs/ — see docs/environments.md for why.
[project]
name = "ego2g1"
version = "2.0.0"
description = "Egocentric human recordings -> pi0.5 -> Unitree G1-D: data, training, serving, deployment"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core + kin + data — the set every role needs
    # numpy stays under 2.0: openpi pins <2.0.0 and the PPU training stack is
    # proven there; one consistent resolution beats two numpy worlds. (The old
    # dev venv ran 2.4.6 — the code is compatible with both.)
    "numpy>=1.22.4,<2",
    "scipy",
    "h5py",
    "pillow",
    "imageio[ffmpeg]",
    "mujoco>=3.10",
    "mink",
    "qpsolvers[daqp]",
    # dataset writing: datasets MUST stay 3.6.0 (newer breaks the pinned lerobot
    # API and writes parquet the training env can't read back)
    "datasets==3.6.0",
    # lerobot at openpi's exact rev (was s005_write_lerobot.INSTALL_CMD)
    "lerobot @ git+https://github.com/huggingface/lerobot@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "pandas",
]

[dependency-groups]
# NOTE the PPU box does NOT uv-sync these — it overlays a borrowed venv via
# envs/ppu-*.sh (see docs/environments.md for why).
train = [
    # openpi as a library from the pinned submodule; jax & friends come from
    # its own dependency tree (jax must stay at openpi's pin — 0.10 breaks
    # its flax scan)
    "openpi",
]
deploy = [
    "unitree_deploy",
    # not on PyPI — Unitree's DDS bindings
    "unitree-sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python",
    "pin",      # pinocchio: gravity-comp rnea in unitree_deploy
    "casadi",   # only unitree_deploy's own IK path; we use mink
    "opencv-python",
    "pyzmq",    # robot image_server client
    "torch",    # unitree_deploy's send_action takes tensors
    "pyarrow",  # replay_dataset reads LeRobot parquet directly
    "tyro",
    "openpi-client",
    "pyyaml",   # deploy/perception/task_config.py's operator-facing task YAML
]
teleop = [
    # televuer is vendored from xr_teleoperate/teleop/televuer (212 KB — the
    # only part of that repo we actually depend on); it brings vuer at its pin
    "televuer",
]
# Only needed for the live GroundingDINO+SAM2 object-detector stage of
# ego2g1/deploy/perception/detector.py (docs/relation_deploy_plan.md §5.3),
# not for the tracker/orientation math around it (those are plain
# numpy/opencv and already covered by `deploy`, which this group includes
# via PEP 735 `include-group` so a real relation_eef rollout is one
# `uv sync --group perception`, not two groups synced side by side). Package
# choices and version ranges mirror data_extraction_zh/pyproject.toml's own
# `perception` group for the same libraries — its `third_party/
# humanego_runtime/preprocess/DINOSAM.py::DINOSAMEngine` is the exact call
# shape `GroundingDinoSam2Detector` is modeled on — EXCEPT torch/torchvision
# are left UNPINNED here (that project pins `torch==2.5.1` against a cu121
# index): `deploy` already depends on a bare, unpinned `torch`, and this
# group deliberately does not add a second, conflicting pin on top of it. Do
# not add a torch/torchvision version pin or a pytorch-cu121 index here
# without checking it against `deploy`'s requirement first.
perception = [
    {include-group = "deploy"},
    "transformers>=4.40,<5",   # GroundingDINO via AutoModelForZeroShotObjectDetection
    "sam2>=1.0",
    "huggingface-hub>=0.23",
    "accelerate>=0.25",
    "safetensors>=0.4",
]
dev = ["pytest"]

[tool.uv.sources]
openpi = { path = "third_party/openpi", editable = true }
televuer = { path = "third_party/televuer", editable = true }
openpi-client = { path = "third_party/openpi/packages/openpi-client", editable = true }
unitree_deploy = { path = "third_party/unitree_deploy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ego2g1"]

# the lerobot pin is a git URL; hatchling requires opting into direct refs
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "ego2g1"]
